  }

var variant = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
var VARIANTER = [

function kl(ts) {
  var d = new Date(ts);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function mins(ms) { return Math.max(0, Math.round(ms / 60000)); }
function hm(ms) {
  var m = mins(ms);
  return m >= 60 ? Math.floor(m / 60) + " t " + (m % 60) + " min" : m + " min";
}
function tilFelt(ts) { return kl(ts); }
function anker(d) {
  var p = d.split("-");
  return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0, 0).getTime();
}
function fraFelt(base, val) {
  var m = /^(\d{1,2}):(\d{2})$/.exec(val || "");
  if (!m) return null;
  var d = new Date(base);
  d.setHours(+m[1], +m[2], 0, 0);
  var ts = d.getTime();
  if (ts < base) ts += 864e5;
  return ts;
}

/* ---------- arbeidskopi ---------- */

function velg(d) {
  day = d;
  var rec = JSON.parse(JSON.stringify(NETTER[d]));
  rec.episodes = rec.episodes.filter(function (e) { return !e.deleted; });
  rec.episodes.sort(function (a, b) { return a.startedAt - b.startedAt; });
  rec.episodes.forEach(function (e, i) { if (!e.id) e.id = "e" + i; });
  S = rec;
  valgtId = S.episodes.length ? S.episodes[0].id : null;
  steg = 0;
  tegn();
}

function eps() { return S.episodes.filter(function (e) { return !e.deleted; }); }
function finn(id) {
  var a = eps();
  for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
  return null;
}
function sortEps() { S.episodes.sort(function (a, b) { return a.startedAt - b.startedAt; }); }

function oppsummering() {
  var a = eps();
  if (!a.length) return null;
  var start = a[0].startedAt, slutt = start;
  var vaken = 0, besok = 0, lengst = 0, oppv = 0, seng = null, apne = 0;
  a.forEach(function (e) {
    var s = e.asleepAt;
    if (s === null || s === undefined) { apne++; s = e.startedAt; }
    if (s > slutt) slutt = s;
    if (e.skip) return;
    vaken += s - e.startedAt;
    besok += e.checks.length;
    e.checks.forEach(function (c) { if (c.dur > lengst) lengst = c.dur; });

    if (e.kind === "bedtime" && e.asleepAt && seng === null) seng = s - e.startedAt;
  });
  if (S.wokeUpAt && S.wokeUpAt > slutt) slutt = S.wokeUpAt;
  var total = Math.max(0, slutt - start);
  return { start: start, slutt: slutt, total: total, vaken: vaken,
    sover: Math.max(0, total - vaken), besok: besok, lengst: lengst,
    oppv: oppv, seng: seng, apne: apne };
}

function el(tag, cls, txt) {

  if (ep.asleepAt === null || ep.asleepAt === undefined) ut.push("mangler sluttid");

var valgtId = null;

function variantA(vert) {
  var a = eps();
  var s = oppsummering();
  var p = el("div", "panel");

  if (!a.length) { p.appendChild(el("p", "empty", "Ingenting registrert denne natten.")); vert.appendChild(p); return; }

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 320 320");
  svg.setAttribute("class", "dial");

  function vinkel(ts) {
    var d = new Date(ts);
    return ((d.getHours() + d.getMinutes() / 60) / 24) * 360;

  function xy(r, deg) {
    var rad = (deg - 90) * Math.PI / 180;

  ring.setAttribute("class", "ring");
  ring.setAttribute("stroke-width", W);
  ring.setAttribute("d", bue(R, vinkel(s.start), vinkel(s.slutt)));

  a.forEach(function (ep) {

    d.setAttribute("stroke-linecap", "butt");

      var v = vinkel(c.at), q0 = xy(R - W / 2, v), q1 = xy(R + W / 2, v);
      var t = document.createElementNS(NS, "line");
      t.setAttribute("class", "tick");
      t.setAttribute("x1", q0[0]); t.setAttribute("y1", q0[1]);
      t.setAttribute("x2", q1[0]); t.setAttribute("y2", q1[1]);

  // draghåndtak på den valgte
  var valgt = finn(valgtId);
  if (valgt) {
    [["startedAt", valgt.startedAt], ["asleepAt", valgt.asleepAt]].forEach(function (par) {
      if (par[1] === null || par[1] === undefined) return;
      var g = document.createElementNS(NS, "circle");
      var pt = xy(R, vinkel(par[1]));
      g.setAttribute("class", "grip");
      g.setAttribute("cx", pt[0]); g.setAttribute("cy", pt[1]); g.setAttribute("r", 9);
      g.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        g.setPointerCapture(ev.pointerId);
        function flytt(e2) {
          var r = svg.getBoundingClientRect();
          var mx = (e2.clientX - r.left) / r.width * 320 - C;
          var my = (e2.clientY - r.top) / r.height * 320 - C;
          var deg = (Math.atan2(my, mx) * 180 / Math.PI + 90 + 360) % 360;
          var timer = deg / 360 * 24;
          var snap = Math.round(timer * 12) / 12;             // 5 minutter
          // Velger det døgnet som ligger nærmest verdien du drar i.
          var d0 = new Date(par[1]);
          d0.setHours(Math.floor(snap), Math.round((snap % 1) * 60), 0, 0);
          var kand = [d0.getTime(), d0.getTime() - 864e5, d0.getTime() + 864e5];
          var ny = kand.reduce(function (best, k) {
            return Math.abs(k - par[1]) < Math.abs(best - par[1]) ? k : best;
          });
          if (par[0] === "startedAt" && valgt.asleepAt && ny >= valgt.asleepAt) return;
          if (par[0] === "asleepAt" && ny <= valgt.startedAt) return;
          valgt[par[0]] = ny;
          sortEps();
          tegn();
        }
        g.addEventListener("pointermove", flytt);
        g.addEventListener("pointerup", function () {
          g.removeEventListener("pointermove", flytt);
        }, { once: true });
      });
      svg.appendChild(g);
    });
  }

  var m1 = document.createElementNS(NS, "text");
  m1.setAttribute("class", "mid");
  m1.setAttribute("x", C); m1.setAttribute("y", C - 4);
  m1.setAttribute("font-size", "26");
  m1.textContent = hm(s.sover);
  svg.appendChild(m1);
  var m2 = document.createElementNS(NS, "text");
  m2.setAttribute("class", "midsub");
  m2.setAttribute("x", C); m2.setAttribute("y", C + 16);
  m2.textContent = "søvn · våken " + hm(s.vaken);
  svg.appendChild(m2);

  p.appendChild(svg);

  if (valgt) {
    var box = el("div", "sel");
    var hd = el("div", "selhead");
    hd.appendChild(el("span", "k", valgt.skip ? "Utenom" :
      (valgt === a[0] ? "Lagt ned" : "Oppvåkning")));
    hd.appendChild(el("span", "facts", valgt.asleepAt ? hm(valgt.asleepAt - valgt.startedAt) : "uten sluttid"));
    box.appendChild(hd);

    var r1 = el("div", "row");
    r1.appendChild(document.createTextNode("Våknet"));
    r1.appendChild(tid(valgt.startedAt, function (ts) {
      if (valgt.asleepAt && ts >= valgt.asleepAt) return false;
      valgt.startedAt = ts;
    }));
    r1.appendChild(document.createTextNode("Sovnet"));
    r1.appendChild(tid(valgt.asleepAt, function (ts) {
      if (ts <= valgt.startedAt) return false;
      valgt.asleepAt = ts;
    }));
    box.appendChild(r1);

    valgt.checks.forEach(function (c, i) {
      var rv = el("div", "row");
      rv.appendChild(document.createTextNode("Besøk " + (i + 1)));
      rv.appendChild(tid(c.at, function (ts) { c.at = ts; }));
      rv.appendChild(sekfelt(c, valgt));
      rv.appendChild(document.createTextNode("sek"));
      var x = el("button", "mini", "fjern");
      x.addEventListener("click", function () { valgt.checks.splice(i, 1); tegn(); });
      rv.appendChild(x);
      box.appendChild(rv);
    });

    var ch = el("div", "chips");
    [["nei", "Våken"], ["ja", "Utenom"]].forEach(function (o) {
      var b = el("button", null, o[1]);
      b.setAttribute("aria-pressed", (o[0] === "ja") === !!valgt.skip ? "true" : "false");
      b.addEventListener("click", function () { valgt.skip = o[0] === "ja"; tegn(); });
      ch.appendChild(b);
    });
    box.appendChild(ch);
    p.appendChild(box);
  }

  p.appendChild(nattlinje(s));
  vert.appendChild(p);
}

function nattlinje(s) {
  var f = el("div", "facts");
  var sek = Math.round(s.lengst / 1000);
  f.innerHTML = "<b>" + kl(s.start) + "–" + kl(s.slutt) + "</b> · " + hm(s.total) +
    " · våken <b>" + hm(s.vaken) + "</b> · " + s.oppv + " oppvåkninger" +
    (s.besok ? " · " + s.besok + " besøk, lengste " +
      (sek > 60 ? "<span class='bad'>" + sek + " s</span>" : sek + " s") : "");
  return f;
}

/* ======================================================================
   B — NATTEN FORTALT. Natten som setninger. Tallene i teksten er
   feltene; du retter der du leser.
   ====================================================================== */

function variantB(vert) {
  var a = eps();
  var s = oppsummering();
  var p = el("div", "panel");
  if (!a.length) { p.appendChild(el("p", "empty", "Ingenting registrert denne natten.")); vert.appendChild(p); return; }

  var t = el("div", "tale");

  a.forEach(function (ep, i) {
    var par = el("p");
    if (ep.deleted) par.className = "strike";

    par.appendChild(el("span", "who", i === 0 ? "Du la henne " : "Hun våknet "));
    par.appendChild(tid(ep.startedAt, function (ts) {
      if (ep.asleepAt && ts >= ep.asleepAt) return false;
      ep.startedAt = ts;
    }));

    if (ep.asleepAt) {
      par.appendChild(el("span", "who", ep.skip ? " og var oppe til " : " og sovnet "));
      par.appendChild(tid(ep.asleepAt, function (ts) {
        if (ts <= ep.startedAt) return false;
        ep.asleepAt = ts;
      }));
      var lengde = mins(ep.asleepAt - ep.startedAt);
      par.appendChild(el("span", "who", " — " + lengde + " minutter"));
    } else {
      par.appendChild(el("span", "warn", " og du vet ikke når hun sovnet: "));
      par.appendChild(tid(null, function (ts) {
        if (ts <= ep.startedAt) return false;
        ep.asleepAt = ts;
      }));
    }

    if (ep.checks.length) {
      par.appendChild(el("span", "who", ". Du var inne "));
      ep.checks.forEach(function (c, j) {
        if (j) par.appendChild(el("span", "who", j === ep.checks.length - 1 ? " og " : ", "));
        par.appendChild(tid(c.at, function (ts) { c.at = ts; }));
        par.appendChild(el("span", "who", " i "));
        par.appendChild(sekfelt(c, ep));
        par.appendChild(el("span", c.dur > 60000 ? "warn" : "who", " sek"));
      });
    }
    par.appendChild(el("span", "who", "."));

    var sk = el("button", "act", ep.skip ? "tell med igjen" : "utenom");
    sk.addEventListener("click", function () { ep.skip = !ep.skip; tegn(); });
    par.appendChild(sk);
    var dl = el("button", "act", "slett");
    dl.addEventListener("click", function () { ep.deleted = true; tegn(); });
    par.appendChild(dl);

    t.appendChild(par);

    var neste = a[i + 1];
    if (ep.asleepAt && neste && neste.startedAt > ep.asleepAt) {
      var sp = el("p", "sleep");
      sp.textContent = "Så sov hun i " + hm(neste.startedAt - ep.asleepAt) + ".";
      t.appendChild(sp);
    }
  });

  var sist = a[a.length - 1];
  var mp = el("p");
  if (S.wokeUpAt && sist.asleepAt && S.wokeUpAt > sist.asleepAt) {
    mp.className = "sleep";
    mp.appendChild(document.createTextNode("Så sov hun i " + hm(S.wokeUpAt - sist.asleepAt) + ", til du hentet henne "));
  } else {
    mp.appendChild(el("span", "warn", "Du har ikke sagt når hun sto opp: "));
  }
  mp.appendChild(tid(S.wokeUpAt, function (ts) {
    if (sist.asleepAt && ts < sist.asleepAt) return false;
    S.wokeUpAt = ts;
  }));
  mp.appendChild(document.createTextNode("."));
  t.appendChild(mp);

  p.appendChild(t);
  p.appendChild(nattlinje(s));
  vert.appendChild(p);
}

/* ======================================================================
   C — GJENNOMGANG. Én hendelse om gangen, stor. Appen sier hva den
   synes ser rart ut, du bekrefter eller retter.
   ====================================================================== */

var steg = 0;

function variantC(vert) {
  var a = eps();
  var p = el("div", "panel");
  if (!a.length) { p.appendChild(el("p", "empty", "Ingenting registrert denne natten.")); vert.appendChild(p); return; }

  var s = oppsummering();
  var antall = a.length + 1;                 // + morgenen
  if (steg >= antall) steg = antall - 1;
  if (steg < 0) steg = 0;

  var pr = el("div", "prog");
  for (var i = 0; i < antall; i++) {
    (function (i) {
      var d = el("div");
      var daarlig = i < a.length ? funn(a[i]).length : (S.wokeUpAt ? 0 : 1);
      d.className = i === steg ? "now" : (daarlig ? "bad" : (i < steg ? "done" : ""));
      d.addEventListener("click", function () { steg = i; tegn(); });
      pr.appendChild(d);
    })(i);
  }
  p.appendChild(pr);

  var card = el("div", "card");

  if (steg < a.length) {
    var ep = a[steg];
    var f = funn(ep);

    card.appendChild(el("span", "step", "Hendelse " + (steg + 1) + " av " + antall +
      " · " + (ep.skip ? "utenom" : steg === 0 ? "lagt ned" : "oppvåkning")));

    var big = el("div", "big");
    big.appendChild(tid(ep.startedAt, function (ts) {
      if (ep.asleepAt && ts >= ep.asleepAt) return false;
      ep.startedAt = ts;
    }));
    big.appendChild(document.createTextNode(" → "));
    big.appendChild(tid(ep.asleepAt, function (ts) {
      if (ts <= ep.startedAt) return false;
      ep.asleepAt = ts;
    }));
    card.appendChild(big);

    card.appendChild(el("div", "say", ep.asleepAt
      ? (steg === 0 ? "Hun brukte " : "Hun var våken i ") + hm(ep.asleepAt - ep.startedAt) +
        (ep.checks.length ? ", og du var inne " + ep.checks.length + " gang" +
          (ep.checks.length > 1 ? "er" : "") + "." : ", uten at du gikk inn.")
      : "Denne har ingen sluttid."));

    ep.checks.forEach(function (c, j) {
      var rv = el("div", "row");
      rv.appendChild(document.createTextNode("Besøk " + (j + 1)));
      rv.appendChild(tid(c.at, function (ts) { c.at = ts; }));
      rv.appendChild(sekfelt(c, ep));
      rv.appendChild(document.createTextNode("sek"));
      var x = el("button", "mini", "feiltrykk");
      x.addEventListener("click", function () { ep.checks.splice(j, 1); tegn(); });
      rv.appendChild(x);
      card.appendChild(rv);
    });

    f.forEach(function (m) { card.appendChild(el("div", "alert", m)); });

    var ch = el("div", "chips");
    [["nei", "Våken"], ["ja", "Utenom"]].forEach(function (o) {
      var b = el("button", null, o[1]);
      b.setAttribute("aria-pressed", (o[0] === "ja") === !!ep.skip ? "true" : "false");
      b.addEventListener("click", function () { ep.skip = o[0] === "ja"; tegn(); });
      ch.appendChild(b);
    });
    card.appendChild(ch);

  } else {
    card.appendChild(el("span", "step", "Hendelse " + antall + " av " + antall + " · morgenen"));
    var b2 = el("div", "big");
    b2.appendChild(tid(S.wokeUpAt, function (ts) {
      var sist = a[a.length - 1];
      if (sist.asleepAt && ts < sist.asleepAt) return false;
      S.wokeUpAt = ts;
    }));
    card.appendChild(b2);
    card.appendChild(el("div", "say", S.wokeUpAt
      ? "Hun sto opp " + kl(S.wokeUpAt) + ". Natten ble " + hm(s.total) + "."
      : "Når hentet du henne? Uten dette vet ikke appen hvor natten slutter."));
    if (!S.wokeUpAt) card.appendChild(el("div", "alert", "mangler morgen"));
  }

  p.appendChild(card);

  var nav = el("div", "nav");
  var bak = el("button", null, "Forrige");
  bak.disabled = steg === 0;
  bak.addEventListener("click", function () { steg--; tegn(); });
  var fram = el("button", "go", steg === antall - 1 ? "Ferdig" : "Ser riktig ut");
  fram.addEventListener("click", function () { if (steg < antall - 1) { steg++; tegn(); } });
  nav.appendChild(bak); nav.appendChild(fram);
  p.appendChild(nav);

  p.appendChild(nattlinje(s));
  vert.appendChild(p);
}

/* ---------- rammeverk ---------- */

function tegnPicker() {
  var pk = document.getElementById("picker");
  pk.textContent = "";
  Object.keys(NETTER).sort().forEach(function (d) {
    var rec = NETTER[d];
    var n = rec.episodes.filter(function (e) { return !e.deleted; }).length;
    var b = el("button", null, d.slice(8) + "." + d.slice(5, 7) + " · " + n + " økt" + (n === 1 ? "" : "er"));
    b.setAttribute("aria-pressed", d === day ? "true" : "false");
    b.addEventListener("click", function () { velg(d); });
    pk.appendChild(b);
  });
}

function tegn() {
  tegnPicker();
  var st = document.getElementById("stage");
  st.textContent = "";
  if (variant === "B") variantB(st);
  else if (variant === "C") variantC(st);
  else variantA(st);
  tegnSwitch();
}

function tegnSwitch() {
  var sw = document.getElementById("switch");
  sw.textContent = "";
  var i = VARIANTER.findIndex(function (v) { return v[0] === variant; });
  if (i < 0) i = 0;

  function gaa(d) {
    var n = VARIANTER[(i + d + VARIANTER.length) % VARIANTER.length][0];
    variant = n;
    var u = new URL(location.href);
    u.searchParams.set("variant", n);
    history.replaceState(null, "", u);
    tegn();
  }
  var v = el("button", null, "‹");
  v.addEventListener("click", function () { gaa(-1); });
  var h = el("button", null, "›");
  h.addEventListener("click", function () { gaa(1); });
  sw.appendChild(v);
  sw.appendChild(el("span", null, VARIANTER[i][0] + " — " + VARIANTER[i][1]));
  sw.appendChild(h);

  if (!sw.dataset.tast) {
    sw.dataset.tast = "1";
    document.addEventListener("keydown", function (e) {
      var t = e.target && e.target.tagName;
      if (t === "INPUT" || t === "TEXTAREA" || (e.target && e.target.isContentEditable)) return;
      if (e.key === "ArrowLeft") gaa(-1);
      if (e.key === "ArrowRight") gaa(1);
    });
  }
}

velg(Object.keys(NETTER).sort()[0]);
})();
</script>
